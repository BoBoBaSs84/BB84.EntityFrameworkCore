name: Feature request
description: Suggest an idea for this project
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: package
    attributes:
      label: Package(s) affected
      description: Which package would the change land in?
      options:
        - BB84.EntityFrameworkCore.Entities.Abstractions
        - BB84.EntityFrameworkCore.Entities
        - BB84.EntityFrameworkCore.Repositories.Abstractions
        - BB84.EntityFrameworkCore.Repositories
        - BB84.EntityFrameworkCore.Repositories.SqlServer
        - New package
        - Not sure
      multiple: true
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem? Please describe.
      description: A clear and concise description of the problem. Ex. I'm always frustrated when [...]
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: |
        A clear and concise description of what you want to happen. Sketch the API you have in mind,
        if you have one.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: Other solutions or workarounds you looked at, and why they fall short.
    validations:
      required: false

  - type: checkboxes
    id: breaking
    attributes:
      label: Breaking change
      options:
        - label: This would be a breaking change to the public API
          required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that helps explain the request.
    validations:
      required: false
